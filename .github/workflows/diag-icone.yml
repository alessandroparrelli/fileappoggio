name: diag-icone
on:
  push:
    paths: ['.github/workflows/diag-icone.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analisi
        run: |
          exec > >(tee diag-out.txt) 2>&1
          UA_SAFARI='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          UA_ICON='MobileSafari/8620.1.15.10.5 CFNetwork/1568.100.1 Darwin/24.0.0'
          for d in signature erp crm eventi intranet; do
            H=https://$d.cnaroma.it
            echo "################ $d"
            curl -sS -L -A "$UA_SAFARI" -D /tmp/h -o /tmp/p.html "$H/" -w 'HTML %{http_code} %{content_type} %{size_download} final=%{url_effective}\n'
            grep -iE '^(server|x-vercel|cache-control|content-security|x-frame|x-robots|location|set-cookie)' /tmp/h | head -12
            echo "-- tag icona/manifest nella pagina:"
            grep -oiE '<link[^>]*rel="?(apple-touch-icon[^"]*|icon|shortcut icon|manifest|mask-icon)"?[^>]{0,160}' /tmp/p.html | cut -c1-220
            grep -oiE '<meta[^>]*(apple-mobile|application-name|apple-touch)[^>]*>' /tmp/p.html
            echo "-- <head> prime 40 righe:"; awk '/<head/,/<\/head>/' /tmp/p.html | head -40 | cut -c1-200
            for p in $(grep -oiE 'rel="?apple-touch-icon[^>]*href="[^"]+"' /tmp/p.html | grep -oE 'href="[^"]+"' | cut -d'"' -f2) /apple-touch-icon.png /apple-touch-icon-precomposed.png /apple-touch-icon-180x180.png /favicon.ico; do
              case $p in http*) U=$p;; data:*) echo "  data-uri"; continue;; /*) U=$H$p;; *) U=$H/$p;; esac
              for UA in "$UA_ICON" "$UA_SAFARI"; do
                curl -sS -A "$UA" -o /tmp/i -D /tmp/ih "$U" -w "  ICON %{http_code} %{content_type} %{size_download}B redirects=%{num_redirects} $U [${UA:0:12}]\n"
                file /tmp/i | sed 's/^/     /'; grep -iE '^(x-vercel-mitigated|x-vercel-challenge|location)' /tmp/ih | sed 's/^/     /'
              done
            done
          done
      - name: Salva
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add diag-out.txt; git commit -m "diag output [skip ci]"; git push
