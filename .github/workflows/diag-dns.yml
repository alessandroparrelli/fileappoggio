name: diag-dns
on:
  push:
    paths: ['.github/workflows/diag-dns.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > >(tee diag-dns.txt) 2>&1
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          for h in cnaroma.it www.cnaroma.it signature.cnaroma.it erp.cnaroma.it crm.cnaroma.it eventi.cnaroma.it intranet.cnaroma.it; do
            echo "## $h"
            for t in CNAME A AAAA CAA HTTPS; do echo "  $t: $(dig +short $t $h @1.1.1.1 | tr '\n' ' ')"; done
          done
          echo "## NS"; dig +short NS cnaroma.it @1.1.1.1
          for d in signature erp; do
            echo "## curl IPv6 $d"; curl -6 -sS -m 15 -o /dev/null -w '%{http_code} %{remote_ip}\n' https://$d.cnaroma.it/apple-touch-icon.png || echo "IPv6 FAIL"
            echo "## curl IPv4 $d"; curl -4 -sS -m 15 -o /dev/null -w '%{http_code} %{remote_ip}\n' https://$d.cnaroma.it/apple-touch-icon.png || echo "IPv4 FAIL"
            echo "## cert $d"; echo | openssl s_client -servername $d.cnaroma.it -connect $d.cnaroma.it:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          done
      - run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add diag-dns.txt; git commit -m "dns [skip ci]"; git push
