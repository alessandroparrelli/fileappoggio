<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dieta 5·2</title>
<!-- v3.1 -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #F5F7F5;
  --surface:   #FFFFFF;
  --card:      #FFFFFF;
  --border:    #E4EBE5;
  --border2:   #D0DDD2;

  --green:     #1B8A4C;
  --green-lt:  #E8F5EE;
  --green-mid: #3AAA6A;
  --teal:      #0D8C8C;
  --teal-lt:   #E5F5F5;
  --violet:    #6B4FBB;
  --violet-lt: #EEE9FB;
  --amber:     #C47B0A;
  --amber-lt:  #FEF4E2;
  --red:       #D63B3B;
  --red-lt:    #FDE8E8;
  --blue:      #2563EB;
  --blue-lt:   #EEF3FF;

  --text:      #111D14;
  --text-soft: #5A7060;
  --text-dim:  #9AB09E;

  --radius:    18px;
  --radius-sm: 12px;
  --radius-xs: 8px;

  --shadow:    0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow:hidden;font-size:15px}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px}
#screen::-webkit-scrollbar{display:none}

/* BOTTOM NAV */
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--border);display:flex;align-items:stretch;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:var(--text-dim);font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.02em;padding:2px 0;cursor:pointer;transition:color 0.18s}
.nav-btn.active{color:var(--green)}
.nav-icon svg{display:block}

/* PAGES */
.page{display:none;padding:0}
.page.active{display:block}

/* HEADER */
.page-header{padding:max(16px,env(safe-area-inset-top)) 16px 0;background:var(--bg)}
.oggi-sticky-wrapper{position:sticky;top:0;z-index:60;background:var(--bg)}

/* STICKY TOTALS BAR */
.sticky-totals{background:var(--surface);border-bottom:1.5px solid var(--border);padding:10px 16px 11px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 3px 12px rgba(0,0,0,0.09)}
.st-cell{text-align:center}
.st-val{font-size:15px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.st-val.k{color:var(--green)}
.st-val.p{color:var(--teal)}
.st-val.g{color:var(--amber)}
.st-val.c{color:var(--violet)}
.st-lbl{font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);margin-top:2px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;color:var(--text)}
.page-subtitle{font-size:13px;color:var(--text-soft);font-weight:500;margin-bottom:12px}

/* PILLS */
.pills-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.pills-row::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:7px 15px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-soft);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.18s;white-space:nowrap}
.pill.active{background:var(--green);border-color:var(--green);color:#fff}
.pill.weekend.active{background:var(--amber);border-color:var(--amber);color:#fff}

/* SECTION LABEL */
.sec-label{padding:14px 16px 6px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim)}

/* MEAL TIME ORARIO */
.meal-orario{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--bg);border:1.5px solid var(--border);color:var(--text-soft);margin-right:6px}

/* EATEN CHECKBOX */
.eaten-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-top:1.5px solid var(--border);cursor:pointer;transition:background 0.15s;-webkit-user-select:none;user-select:none}
.eaten-row:active{background:var(--green-lt)}
.eaten-row.done{background:var(--green-lt)}
.eaten-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.18s}
.eaten-row.done .eaten-check{background:var(--green);border-color:var(--green)}
.eaten-label{font-size:13px;font-weight:700;color:var(--text-soft);flex:1;margin-left:10px}
.eaten-row.done .eaten-label{color:var(--green)}
.eaten-kcal{font-size:12px;font-weight:700;color:var(--text-dim)}
.eaten-row.done .eaten-kcal{color:var(--green)}

/* EATEN PROGRESS IN STICKY */
.st-progress{margin-top:6px;height:3px;border-radius:2px;background:var(--border);overflow:hidden;grid-column:1/-1}
.st-progress-fill{height:100%;border-radius:2px;background:var(--green);transition:width 0.4s ease}
.st-eaten-label{grid-column:1/-1;font-size:10px;font-weight:600;color:var(--text-dim);text-align:center;letter-spacing:0.04em}

/* MEAL CARD done state */
.meal-card.eaten{border-color:var(--green);background:linear-gradient(to bottom,#f6fdf8,#fff)}
.meal-card.eaten .meal-name{color:var(--green)}

/* STICKY TOTALS extended */
.sticky-totals{background:var(--surface);border-bottom:1.5px solid var(--border);padding:10px 16px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 3px 12px rgba(0,0,0,0.09)}

/* CONSUMED BAR */
.consumed-row{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px}
.consumed-bar-wrap{flex:1;height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.consumed-bar-fill{height:100%;border-radius:3px;background:var(--green);transition:width 0.4s ease}
.consumed-label{font-size:10px;font-weight:700;color:var(--text-soft);white-space:nowrap}
.consumed-label.done{color:var(--green)}

/* ORARIO colors */
.orario-col{background:#FEF4E2;border-color:#F5D48A;color:var(--amber)}
.orario-pra{background:#E8F5EE;border-color:#8EC9A8;color:var(--green)}
.orario-cen{background:#EEE9FB;border-color:#B8A4E8;color:var(--violet)}
.orario-snu{background:#E5F5F5;border-color:#7ABFBF;color:var(--teal)}

/* Meal card top row */
.meal-type-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.meal-type-left{display:flex;align-items:center;flex-wrap:wrap;gap:5px}

/* override old sticky-totals grid col */

/* SECTION CONSUMED */
.consumed-section{margin:0 16px 10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.consumed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.consumed-cell{text-align:center}
.consumed-val{font-size:18px;font-weight:800}
.consumed-sub{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-top:2px}
.consumed-vs{font-size:10px;color:var(--text-dim);margin-top:2px}

/* SECTION LABEL */
/* MEAL CARD */
.meal-card{margin:0 16px 10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow 0.2s}
.meal-head{padding:14px 14px 10px}
.meal-type-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.meal-type-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.04em}
.meal-type-badge.col{background:var(--amber-lt);color:var(--amber)}
.meal-type-badge.pra{background:var(--green-lt);color:var(--green)}
.meal-type-badge.cen{background:var(--violet-lt);color:var(--violet)}
.meal-type-badge.snu{background:var(--teal-lt);color:var(--teal)}

.shuffle-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius-xs);border:1.5px solid var(--border);background:var(--bg);color:var(--text-soft);font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s}
.shuffle-btn:active{background:var(--green-lt);border-color:var(--green);color:var(--green);transform:scale(0.96)}

.meal-name{font-size:18px;font-weight:800;letter-spacing:-0.02em;color:var(--text);margin-bottom:4px}
.meal-desc{font-size:13px;color:var(--text-soft);font-weight:400;line-height:1.55;margin-bottom:2px}

/* MEAL INGREDIENTS */
.meal-ingredients{padding:10px 14px;background:var(--bg);border-top:1.5px solid var(--border)}
.ingr-title{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.ingr-list{display:flex;flex-wrap:wrap;gap:5px}
.ingr-chip{background:var(--surface);border:1.5px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:500;color:var(--text-soft)}

/* MACROS */
.meal-macros{display:grid;grid-template-columns:repeat(4,1fr);border-top:1.5px solid var(--border)}
.macro-cell{padding:10px 6px;text-align:center;border-right:1px solid var(--border)}
.macro-cell:last-child{border-right:none}
.macro-val{font-size:16px;font-weight:800;letter-spacing:-0.02em}
.macro-val.k{color:var(--green)}
.macro-val.p{color:var(--teal)}
.macro-val.g{color:var(--amber)}
.macro-val.c{color:var(--violet)}
.macro-lbl{font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);margin-top:1px}

/* DAILY TOTALS */
.totals-card{margin:0 16px 10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.totals-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:14px}
.totals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.total-cell{text-align:center}
.total-num{font-size:22px;font-weight:900;letter-spacing:-0.04em}
.total-num.k{color:var(--green)}
.total-num.p{color:var(--teal)}
.total-num.g{color:var(--amber)}
.total-num.c{color:var(--violet)}
.total-sub{font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);margin-top:2px}
.total-bar{height:4px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
.total-fill{height:100%;border-radius:3px;transition:width 0.4s ease}
.total-fill.k{background:var(--green)}
.total-fill.p{background:var(--teal)}
.total-fill.g{background:var(--amber)}
.total-fill.c{background:var(--violet)}

/* INFO BANNER */
.info-banner{margin:0 16px 10px;background:var(--blue-lt);border:1.5px solid #BFCFF7;border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--blue);font-weight:500;line-height:1.6}

/* WEEK */
.week-day-block{margin:0 16px 8px}
.week-day-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.week-day-head{padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.week-day-name{font-size:15px;font-weight:800}
.week-day-name.wk{color:var(--amber)}
.week-day-name.wd{color:var(--green)}
.week-day-kcal{font-size:14px;font-weight:700;color:var(--text-soft)}
.chevron{transition:transform 0.2s;color:var(--text-dim)}
.chevron.open{transform:rotate(180deg)}
.week-day-body{display:none;border-top:1.5px solid var(--border)}
.week-day-body.open{display:block}
.week-meal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.week-meal-row:last-child{border-bottom:none}
.wm-type{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim)}
.wm-name{font-size:13px;font-weight:700;margin-top:1px}
.wm-kcal{font-size:13px;font-weight:700;color:var(--green)}
.week-totals-row{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 14px;background:var(--bg);border-top:1.5px solid var(--border)}
.wt-cell{text-align:center}
.wt-val{font-size:14px;font-weight:800}
.wt-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-top:1px}

/* PROGRESS 28 */
.prog-card{margin:0 16px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.prog-lbl{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim)}
.prog-count{font-size:24px;font-weight:900;color:var(--green)}
.days28-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.d28{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:all 0.15s}
.d28.done{background:var(--green-lt);border-color:var(--green);color:var(--green)}
.d28.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-lt)}
.d28:active{transform:scale(0.9)}

/* FREQUENZE */
.freq-card{margin:0 16px 10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.freq-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.freq-name{font-size:15px;font-weight:800}
.freq-note{font-size:11px;color:var(--text-soft);font-weight:500;margin-top:2px}
.freq-num{font-size:28px;font-weight:900}
.freq-num.ok{color:var(--green)}
.freq-num.over{color:var(--red)}
.freq-dots{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.f-dot{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s}
.f-dot.on{background:var(--green-lt);border-color:var(--green)}
.f-dot.ov{background:var(--red-lt);border-color:var(--red)}
.f-dot:active{transform:scale(0.9)}
.freq-actions{display:flex;gap:8px;align-items:center}
.freq-plus{background:var(--green);color:#fff;border:none;border-radius:var(--radius-xs);padding:8px 18px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s}
.freq-plus:active{transform:scale(0.95)}
.freq-reset-btn{background:none;border:none;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;text-decoration:underline}
.all-reset-btn{display:block;width:calc(100% - 32px);margin:0 16px 12px;padding:13px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;text-align:center}
.all-reset-btn:active{background:var(--bg)}

/* SPESA */
.spesa-header-card{margin:0 16px 4px;background:var(--green);border-radius:var(--radius);padding:14px 16px;color:#fff;box-shadow:var(--shadow-lg)}
.spesa-hrow{display:flex;justify-content:space-between;align-items:center}
.spesa-htitle{font-size:14px;font-weight:700;opacity:0.9}
.spesa-hcount{font-size:26px;font-weight:900}
.spesa-hsub{font-size:11px;opacity:0.75;margin-top:2px}
.spesa-reset{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:6px;padding:5px 12px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer}

.spesa-cat-block{margin:0 16px 10px}
.spesa-cat-lbl{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;padding:0 2px}
.spesa-cat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow)}
.spesa-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.12s}
.spesa-item:last-child{border-bottom:none}
.spesa-item:active{background:var(--bg)}
.spesa-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.spesa-item.done .spesa-check{background:var(--green);border-color:var(--green)}
.spesa-item-info{flex:1}
.spesa-item-name{font-size:13px;font-weight:600;transition:all 0.15s}
.spesa-item.done .spesa-item-name{text-decoration:line-through;color:var(--text-dim)}
.spesa-item-qty{font-size:11px;color:var(--text-soft);font-weight:500;margin-top:1px}
.spesa-from{font-size:10px;color:var(--green);font-weight:600;margin-top:2px}
.spesa-static .spesa-from{color:var(--text-dim)}

/* TIMER */
.timer-card{margin:0 16px 10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
.timer-icon{margin-bottom:6px}
.timer-lbl{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.timer-sub{font-size:12px;color:var(--text-soft);font-weight:500;margin-bottom:14px}
.timer-display{font-size:54px;font-weight:900;letter-spacing:-0.05em;font-variant-numeric:tabular-nums;margin-bottom:16px}
.timer-display.green{color:var(--green)}
.timer-display.amber{color:var(--amber)}
.timer-display.violet{color:var(--violet)}
.timer-btns{display:flex;gap:8px;justify-content:center}
.t-btn{flex:1;max-width:110px;padding:12px;border-radius:var(--radius-sm);border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s}
.t-btn:active{transform:scale(0.96)}
.t-btn.go{background:var(--green);color:#fff}
.t-btn.go.amber{background:var(--amber)}
.t-btn.go.violet{background:var(--violet)}
.t-btn.pause{background:var(--red);color:#fff}
.t-btn.rst{background:var(--bg);border:1.5px solid var(--border);color:var(--text-soft)}

/* TOAST */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--text);color:#fff;padding:10px 18px;border-radius:24px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;opacity:0;transition:all 0.25s;z-index:999;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ANIM */
@keyframes pop{0%{opacity:0;transform:scale(0.96) translateY(6px)}100%{opacity:1;transform:none}}
.meal-card{animation:pop 0.2s ease}
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <div class="page active" id="page-oggi">
      <div class="oggi-sticky-wrapper">
        <div class="page-header">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px">
            <div class="page-title">Oggi</div>
            <div id="oggi-badge" style="margin-top:6px"></div>
          </div>
          <div class="page-subtitle" id="oggi-sub"></div>
          <div class="pills-row" id="day-pills"></div>
        </div>
        <div class="sticky-totals" id="sticky-totals" style="grid-template-columns:repeat(4,1fr);row-gap:2px">
          <div class="st-cell"><div class="st-val k" id="st-kcal">—</div><div class="st-lbl">kcal</div></div>
          <div class="st-cell"><div class="st-val p" id="st-p">—</div><div class="st-lbl">prot.</div></div>
          <div class="st-cell"><div class="st-val g" id="st-g">—</div><div class="st-lbl">grassi</div></div>
          <div class="st-cell"><div class="st-val c" id="st-c">—</div><div class="st-lbl">carbo</div></div>

let S={
  selDay: 0,
  meals:{},       // "d_m" -> idx
  eaten:{},       // "d_m" -> bool (spuntato come mangiato)
  days28: Array(28).fill(false),
  freqs:{pesce:0,carne:0,uova:0,formaggi:0,affettati:0},
  spesa:{},       // itemKey -> bool
  expanded:{},
};

function load(){try{const s=localStorage.getItem('d52v3');if(s)Object.assign(S,JSON.parse(s));if(!S.days28||S.days28.length!==28)S.days28=Array(28).fill(false);}catch(e){}}
function save(){try{localStorage.setItem('d52v3',JSON.stringify(S));}catch(e){}}

function mealKey(d,m){return `${d}_${m}`}
function getRicette(d,m){
  const we=GIORNI[d].we;
  if(m==='col')return we?R.col_w:R.col_f;
  if(m==='pra')return we?R.pra_w:R.pra_f;
  if(m==='cen')return we?R.cen_w:R.cen_f;
  if(m==='snu')return R.snu_f;
  return[];
}
function getCurRicetta(d,m){
  const k=mealKey(d,m);
  const list=getRicette(d,m);
  const idx=S.meals[k]!==undefined?S.meals[k]:0;
  return list[idx%list.length];
}
function getMeals(d){
  return GIORNI[d].we?['col','pra','cen']:['col','pra','cen','snu'];
}
function getEatenTotals(d){
  const tot={kcal:0,p:0,g:0,c:0};
  getMeals(d).forEach(m=>{
    if(S.eaten[mealKey(d,m)]){
      const r=getCurRicetta(d,m);
      if(r){tot.kcal+=r.kcal;tot.p+=r.p;tot.g+=r.g;tot.c+=r.c;}
    }
  });
  return tot;
}
function toggleEaten(d,m){
  const k=mealKey(d,m);
  S.eaten[k]=!S.eaten[k];
  save();
  renderOggi();
  const r=getCurRicetta(d,m);
  if(S.eaten[k])showToast(`✅ ${r.nome} · ${r.kcal} kcal`);
}
function getDayTotals(d){
  const tot={kcal:0,p:0,g:0,c:0};
  getMeals(d).forEach(m=>{
    const r=getCurRicetta(d,m);
    if(r){tot.kcal+=r.kcal;tot.p+=r.p;tot.g+=r.g;tot.c+=r.c;}
  });
  return tot;
}

      const r=getCurRicetta(d,m);
      if(!r||!r.ingr)return;
      r.ingr.forEach(ing=>{
        const k=ing.n;
        if(!byKey[k]){byKey[k]={n:ing.n,quantities:[],days:[],meals:[],cat:guessCat(ing.n)};}
        byKey[k].quantities.push(ing.q);
        byKey[k].days.push(GIORNI[d].s);
        byKey[k].meals.push(mealLabel(m));
      });
    });
  }
  // group by category
  const cats={};
  Object.values(byKey).forEach(item=>{
    if(!cats[item.cat])cats[item.cat]=[];
    cats[item.cat].push(item);
  });
  STATIC_ITEMS.forEach(si=>{
    if(!cats[si.cat])cats[si.cat]=[];
    // avoid duplicates
    if(!cats[si.cat].find(x=>x.n===si.n)){
      cats[si.cat].push({n:si.n,quantities:[si.q],days:[],meals:[],cat:si.cat,static:true});
    }
  });
  return cats;
}

function guessCat(name){
  const n=name.toLowerCase();
  if(/salmone|merluzzo|spigola|tonno|sgombro|polpo|pesce|branzino|acciughe|sardine/.test(n))return "🐟 Pesce";
  if(/pollo|tacchino|manzo|coniglio|maiale|arrosto|carne/.test(n))return "🍗 Carne";
  if(/bresaola|prosciutto|speck|tacchino a fette/.test(n))return "🥩 Affettati";
  if(/yogurt|mozzarella|ricotta|parmigiano|stracchino|philadelphia|formaggio/.test(n))return "🧀 Latticini";
  if(/uov/.test(n))return "🥚 Uova";
  if(/zucchine|spinaci|broccoli|funghi|rucola|pomodori|peperoni|finocchi|insalata|melanzane|carote|cetrioli|verdure|cipolla|aglio|basilico|prezzemolo|rosmarino|origano/.test(n))return "🥬 Verdure";
  if(/pasta|farro|riso|gallette|pane|biscott|ciambellone|crostata|fette biscottate/.test(n))return "🌾 Cereali";
  if(/ceci|lenticchie|fagioli|legumi/.test(n))return "🫘 Legumi";
  if(/noci|mandorle|pistacchi|nocciole|olive|semi|anacardi/.test(n))return "🥜 Frutta secca";
  if(/limone|frutta|mele|arancia|banana/.test(n))return "🍊 Frutta";
  return "🫙 Dispensa";
}

function mealLabel(m){
  return {col:"Colazione",pra:"Pranzo",cen:"Cena",snu:"Spuntino"}[m]||m;
}

function mealTypeInfo(m){
  return {
    col:{label:"Colazione",cls:"col"},
    pra:{label:"Pranzo",cls:"pra"},
    cen:{label:"Cena",cls:"cen"},
    snu:{label:"Spuntino",cls:"snu"},
  }[m]||{label:m,cls:"col"};
}

// ─── RENDER OGGI ─────────────────────────────────────────────
function renderOggi(){
  const d=S.selDay;
  const g=GIORNI[d];
  const todayReal=new Date().getDay()===0?6:new Date().getDay()-1;
  document.getElementById('oggi-sub').textContent=g.n+(d===todayReal?' · oggi':'');
  document.getElementById('oggi-badge').innerHTML=g.we
    ?'<span style="background:var(--amber-lt);color:var(--amber);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700">Weekend</span>'
    :'<span style="background:var(--green-lt);color:var(--green);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700">Feriale</span>';

  document.getElementById('day-pills').innerHTML=GIORNI.map((gg,i)=>

  ).join('');

  const ORARI_WE={col:'9:00',pra:'13:00',cen:'20:00'};

    const r=getCurRicetta(d,m);
    const {label,cls}=mealTypeInfo(m);
    const list=getRicette(d,m);
    const curIdx=(S.meals[mealKey(d,m)]||0)%list.length;
    const ek=mealKey(d,m);
    const isEaten=!!S.eaten[ek];
    const orario=g.we?(ORARI_WE[m]||'—'):ORARI[m];
    html+=`
    <div class="meal-card ${isEaten?'eaten':''}">
      <div class="meal-head">
        <div class="meal-type-row">
          <div class="meal-type-left">
            <span class="meal-type-badge ${cls}">${label}</span>
            <span class="meal-orario orario-${cls}">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
              ${orario}
            </span>
          </div>
          <button class="shuffle-btn" onclick="doShuffle(${d},'${m}')">${IC.shuffle} Cambia</button>
        </div>
        <div class="meal-name">${r.nome}</div>
        <div class="meal-desc">${r.desc}</div>
        <div style="font-size:10px;color:var(--text-dim);font-weight:500;margin-top:3px">
          Ricetta ${curIdx+1} di ${list.length} ${r.unico?'· <span style="color:var(--teal)">Pasto unico</span>':''}${r.free?'· <span style="color:var(--amber)">Pasto libero 🎉</span>':''}
        </div>
      </div>
      ${r.ingr&&r.ingr.length?`
      <div class="meal-ingredients">
        <div class="ingr-title">Ingredienti</div>
        <div class="ingr-list">
          ${r.ingr.map(i=>`<div class="ingr-chip">${i.n} <span style="color:var(--green);font-weight:700">${i.q}</span></div>`).join('')}
        </div>
      </div>`:''}
      <div class="meal-macros">
        <div class="macro-cell"><div class="macro-val k">${r.kcal}</div><div class="macro-lbl">kcal</div></div>
        <div class="macro-cell"><div class="macro-val p">${r.p}g</div><div class="macro-lbl">prot.</div></div>
        <div class="macro-cell"><div class="macro-val g">${r.g}g</div><div class="macro-lbl">grassi</div></div>
        <div class="macro-cell"><div class="macro-val c">${r.c}g</div><div class="macro-lbl">carbo</div></div>
      </div>
      <div class="eaten-row ${isEaten?'done':''}" onclick="toggleEaten(${d},'${m}')">
        <div class="eaten-check">${isEaten?IC.check:''}</div>
        <span class="eaten-label">${isEaten?'Mangiato ✓':'Segna come mangiato'}</span>
        <span class="eaten-kcal">${r.kcal} kcal</span>
      </div>
    </div>`;
  });

  const tot=getDayTotals(d);
  const eaten=getEatenTotals(d);
  const allMeals=getMeals(d);
  const eatenCount=allMeals.filter(m=>S.eaten[mealKey(d,m)]).length;
  const pct=tot.kcal>0?Math.round(eaten.kcal/tot.kcal*100):0;

  // update sticky totals bar
  document.getElementById('st-kcal').textContent=tot.kcal;
  document.getElementById('st-p').textContent=tot.p+'g';
  document.getElementById('st-g').textContent=tot.g+'g';
  document.getElementById('st-c').textContent=tot.c+'g';
  document.getElementById('st-eaten').textContent=eaten.kcal>0?`${eaten.kcal} kcal mangiati (${pct}%)`:`${eatenCount}/${allMeals.length} pasti spuntati`;
  document.getElementById('st-bar-fill').style.width=pct+'%';

  // consumed section
  html+=`
  <div class="consumed-section">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.06em">Consumato oggi</div>
      <div style="font-size:11px;font-weight:700;color:${eatenCount===allMeals.length?'var(--green)':'var(--text-dim)'}">${eatenCount}/${allMeals.length} pasti</div>
    </div>
    <div class="consumed-grid">
      ${[['k','kcal',eaten.kcal,tot.kcal],['p','prot.',eaten.p+'g',tot.p+'g'],['g','grassi',eaten.g+'g',tot.g+'g'],['c','carbo',eaten.c+'g',tot.c+'g']].map(([cls,lbl,ev,tv])=>`
      <div class="consumed-cell">
        <div class="consumed-val" style="color:var(--${cls==='k'?'green':cls==='p'?'teal':cls==='g'?'amber':'violet'})">${ev}</div>
        <div class="consumed-sub">${lbl}</div>
        <div class="consumed-vs">di ${tv}</div>
      </div>`).join('')}
    </div>
  </div>`;

  html+=`
  <div class="info-banner">
    💧 Min. 1,5 lt acqua · 🚶 30 min camminata · 🍵 Tisana al finocchio dopo cena
    ${g.we?'<br>🎉 Weekend: pasto libero a pranzo, carboidrati a cena':''}
  </div>`;

  document.getElementById('oggi-content').innerHTML=html;
}

function selDay(i){S.selDay=i;S._spesaStale=true;save();renderOggi();document.getElementById('screen').scrollTo(0,0);}
function doShuffle(d,m){
  const k=mealKey(d,m);
  const list=getRicette(d,m);
  S.meals[k]=((S.meals[k]||0)+1)%list.length;
  save();
  renderOggi();
  // always sync other views
  if(currentPage==='settimana')renderSettimana();
  else if(currentPage==='spesa')renderSpesa();
  // mark spesa as stale so it rebuilds on next open
  S._spesaStale=true;
  showToast('Ricetta cambiata 🔀');
}

// ─── RENDER SETTIMANA ─────────────────────────────────────────
function renderSettimana(){
  const done28=S.days28.filter(Boolean).length;
  let html=`
  <div class="sec-label">Progresso 28 giorni</div>
  <div class="prog-card">
    <div class="prog-header">
      <span class="prog-lbl">Giorni completati</span>
      <span class="prog-count">${done28}<span style="font-size:16px;color:var(--text-dim)">/28</span></span>
    </div>
    <div class="days28-grid">
      ${S.days28.map((ok,i)=>`<div class="d28 ${ok?'done':''}" onclick="toggleDay28(${i})">${i+1}</div>`).join('')}
    </div>
  </div>
  <div class="sec-label">Piano settimanale</div>`;

  GIORNI.forEach((g,d)=>{
    const tot=getDayTotals(d);
    const meals=getMeals(d);
    const exp=S.expanded[d];
    html+=`
    <div class="week-day-block">
      <div class="week-day-card">
        <div class="week-day-head" onclick="toggleExp(${d})">
          <div>
            <div class="week-day-name ${g.we?'wk':'wd'}">${g.n}</div>
            <div style="font-size:11px;color:var(--text-soft);font-weight:500;margin-top:2px">${meals.length} pasti</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="week-day-kcal">${tot.kcal} kcal</span>
            <span class="chevron ${exp?'open':''}">${IC.chevron}</span>
          </div>
        </div>
        <div class="week-day-body ${exp?'open':''}">
          ${meals.map(m=>{
            const r=getCurRicetta(d,m);
            const {label}=mealTypeInfo(m);
            return`<div class="week-meal-row">
              <div><div class="wm-type">${label}</div><div class="wm-name">${r.nome}</div></div>
              <div class="wm-kcal">${r.kcal}</div>
            </div>`;
          }).join('')}
          <div class="week-totals-row">
            ${[['k','kcal',tot.kcal],['p','prot',tot.p+'g'],['g','grassi',tot.g+'g'],['c','carbo',tot.c+'g']].map(([cls,lbl,val])=>`
            <div class="wt-cell"><div class="wt-val" style="color:var(--${cls==='k'?'green':cls==='p'?'teal':cls==='g'?'amber':'violet'})">${val}</div><div class="wt-lbl">${lbl}</div></div>`).join('')}

        </div>

}
function toggleDay28(i){S.days28[i]=!S.days28[i];save();renderSettimana();if(S.days28[i])showToast('Giorno completato ✅');}
function toggleExp(d){S.expanded[d]=!S.expanded[d];save();renderSettimana();}

// ─── RENDER FREQUENZE ────────────────────────────────────────
const FDEF=[
  {k:'pesce',icon:'🐟',n:'Pesce',max:4,note:'max 2×/sett lun–ven'},
  {k:'carne',icon:'🍗',n:'Carne',max:4,note:'max 2×/sett lun–ven'},
  {k:'uova',icon:'🥚',n:'Uova',max:2,note:'max 2×/settimana'},
  {k:'formaggi',icon:'🧀',n:'Formaggi',max:1,note:'max 1×/settimana'},
  {k:'affettati',icon:'🥩',n:'Affettati',max:2,note:'max 2×/settimana'},
];
function renderFrequenze(){
  let html=`<div class="info-banner" style="margin:8px 16px 10px">Tappa ogni volta che consumi il gruppo. Reset ogni lunedì.</div>`;
  FDEF.forEach(f=>{
    const cur=S.freqs[f.k]||0;
    const over=cur>f.max;
    const dots=Array.from({length:Math.max(f.max,cur)},(_,i)=>{
      const filled=i<cur;
      const isOver=filled&&i>=f.max;
      return`<div class="f-dot ${filled?(isOver?'ov':'on'):''}" onclick="tapFreq('${f.k}',${i+1})">${filled?IC.check:''}</div>`;
    }).join('');
    html+=`
    <div class="freq-card">
      <div class="freq-top">
        <div>
          <div class="freq-name">${f.icon} ${f.n}</div>
          <div class="freq-note">${f.note}</div>
        </div>
        <div class="freq-num ${over?'over':'ok'}">${cur}<span style="font-size:14px;color:var(--text-dim)">/${f.max}</span></div>
      </div>
      <div class="freq-dots">${dots}</div>
      <div class="freq-actions">
        <button class="freq-plus" onclick="incFreq('${f.k}')">+ Aggiungi</button>
        <button class="freq-reset-btn" onclick="resetFreq('${f.k}')">Azzera</button>
      </div>
    </div>`;
  });
  html+=`<button class="all-reset-btn" onclick="resetAllFreqs()">↺ Reset tutti i contatori (nuovo lunedì)</button>`;
  document.getElementById('freq-content').innerHTML=html;
}
function incFreq(k){
  S.freqs[k]=(S.freqs[k]||0)+1;save();renderFrequenze();
  const f=FDEF.find(x=>x.k===k);
  if(S.freqs[k]>f.max)showToast(`⚠️ ${f.n}: limite superato!`);
  else showToast(`${f.icon} +1 ${f.n}`);
}
function tapFreq(k,val){S.freqs[k]=val;save();renderFrequenze();}
function resetFreq(k){S.freqs[k]=0;save();renderFrequenze();}
function resetAllFreqs(){FDEF.forEach(f=>S.freqs[f.k]=0);save();renderFrequenze();showToast('Frequenze azzerate ✅');}

// ─── RENDER SPESA ────────────────────────────────────────────
function renderSpesa(){
  const cats=buildSpesaList();
  const allItems=Object.values(cats).flat();
  const totalN=allItems.length;
  const doneN=allItems.filter(i=>S.spesa[i.n]).length;

  let html=`
  <div class="spesa-header-card">
    <div class="spesa-hrow">
      <div>
        <div class="spesa-htitle">Lista della settimana</div>
        <div class="spesa-hsub">${doneN} di ${totalN} articoli</div>
      </div>
      <button class="spesa-reset" onclick="resetSpesa()">Azzera</button>
    </div>
    <div style="margin-top:10px;background:rgba(255,255,255,0.25);border-radius:6px;height:6px;overflow:hidden">
      <div style="height:100%;width:${totalN?doneN/totalN*100:0}%;background:#fff;border-radius:6px;transition:width 0.3s"></div>
    </div>
  </div>
  <div class="info-banner" style="margin:8px 16px 10px;font-size:11px">
    La lista si aggiorna automaticamente quando cambi le ricette della settimana. Gli ingredienti sono raggruppati per categoria.
  </div>`;

  const catOrder=["🐟 Pesce","🍗 Carne","🥩 Affettati","🧀 Latticini","🥚 Uova","🥬 Verdure","🌾 Cereali","🫘 Legumi","🥜 Frutta secca","🍊 Frutta","🫙 Dispensa","🍵 Bevande","🍫 Sfizi"];
  catOrder.forEach(cat=>{
    if(!cats[cat]||!cats[cat].length)return;
    const items=cats[cat];
    html+=`
    <div class="spesa-cat-block">
      <div class="spesa-cat-lbl">${cat}</div>
      <div class="spesa-cat-card">
        ${items.map(item=>{
          const done=!!S.spesa[item.n];
          const fromText=item.static?'':'Da: '+[...new Set(item.meals)].join(', ');
          return`
          <div class="spesa-item ${done?'done':''} ${item.static?'spesa-static':''}" onclick="toggleSpesa('${item.n.replace(/'/g,"\\'")}')">
            <div class="spesa-check">${done?IC.check:''}</div>
            <div class="spesa-item-info">
              <div class="spesa-item-name">${item.n}</div>
              <div class="spesa-item-qty">${[...new Set(item.quantities)].join(' · ')}</div>
              ${fromText?`<div class="spesa-from">${fromText}</div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  document.getElementById('spesa-content').innerHTML=html;
  document.getElementById('spesa-sub').textContent=`${doneN}/${totalN} articoli · aggiornata dalle ricette`;
}
function toggleSpesa(n){S.spesa[n]=!S.spesa[n];save();renderSpesa();}
function resetSpesa(){S.spesa={};save();renderSpesa();showToast('Lista azzerata ✅');}

// ─── RENDER TIMER ────────────────────────────────────────────
const TDEFS=[
  {id:'tisana',icon:'🍵',n:'Tisana al finocchio',sub:'Dopo ogni cena, tutti i giorni',mins:10,col:'green'},
  {id:'walk',icon:'🚶',n:'Camminata',sub:'30 minuti di movimento leggero',mins:30,col:'amber'},
  {id:'break',icon:'⏳',n:'Pausa digestiva',sub:'Attesa tra pasti',mins:60,col:'violet'},
];
let TM={};

function renderTimer(){
  let html='';
  TDEFS.forEach(t=>{
    const tm=TM[t.id]||{rem:t.mins*60,running:false};
    const m=String(Math.floor(tm.rem/60)).padStart(2,'0');
    const s=String(tm.rem%60).padStart(2,'0');
    html+=`
    <div class="timer-card">
      <div class="timer-icon" style="font-size:32px">${t.icon}</div>
      <div class="timer-lbl">${t.n}</div>
      <div class="timer-sub">${t.sub}</div>
      <div class="timer-display ${t.col}" id="td-${t.id}">${m}:${s}</div>
      <div class="timer-btns">
        <button class="t-btn ${tm.running?'pause':`go ${t.col}`}" onclick="toggleT('${t.id}',${t.mins})">
          ${tm.running?IC.pause+' Pausa':IC.play+' Avvia'}
        </button>
        <button class="t-btn rst" onclick="resetT('${t.id}',${t.mins})">${IC.reset} Reset</button>
      </div>
    </div>`;
  });
  html+=`<div class="info-banner">💡 Elimina zucchero, dolcificanti, bevande gassate e alcol · Bevi almeno 1,5 lt di acqua al giorno</div>`;
  document.getElementById('timer-content').innerHTML=html;
}

function toggleT(id,mins){
  if(!TM[id])TM[id]={rem:mins*60,running:false};
  const t=TM[id];
  if(t.running){t.running=false;clearInterval(t.iv);}
  else{
    if(t.rem<=0)t.rem=mins*60;
    t.running=true;
    t.iv=setInterval(()=>{
      t.rem--;
      if(t.rem<=0){t.rem=0;t.running=false;clearInterval(t.iv);showToast('Timer completato ✅');}
      const el=document.getElementById('td-'+id);
      if(el)el.textContent=String(Math.floor(t.rem/60)).padStart(2,'0')+':'+String(t.rem%60).padStart(2,'0');
    },1000);
  }
  renderTimer();
}
function resetT(id,mins){if(TM[id])clearInterval(TM[id].iv);TM[id]={rem:mins*60,running:false};renderTimer();}

// ─── NAV ─────────────────────────────────────────────────────
let currentPage='oggi';
const PAGES={oggi:renderOggi,settimana:renderSettimana,frequenze:renderFrequenze,spesa:renderSpesa,timer:renderTimer};
function goPage(name){
  document.querySelector('.page.active')?.classList.remove('active');
  document.getElementById('page-'+name).classList.add('active');
  document.querySelector('.nav-btn.active')?.classList.remove('active');
  document.getElementById('nav-'+name).classList.add('active');
  currentPage=name;
  document.getElementById('screen').scrollTo(0,0);
  // always rebuild spesa fresh (ingredients may have changed)
  if(name==='spesa') S._spesaStale=true;
  PAGES[name]();
}

// ─── TOAST ───────────────────────────────────────────────────
let toastT;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);
}

// ─── INIT ────────────────────────────────────────────────────
load();
S.selDay=new Date().getDay()===0?6:new Date().getDay()-1;
renderOggi();
</script>
