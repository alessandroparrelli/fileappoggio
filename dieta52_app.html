<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dieta 5·2</title>
<style>
:root {
  --bg: #0e1912;
  --surface: #162318;
  --card: #1e3024;
  --card2: #243829;
  --border: #2d4a34;
  --green: #4dc472;
  --green-dim: #2d7444;
  --green-glow: rgba(77,196,114,0.15);
  --amber: #f0a832;
  --amber-dim: #7a5210;
  --amber-glow: rgba(240,168,50,0.15);
  --red: #e05555;
  --text: #ddeee2;
  --text-soft: #7aab86;
  --text-dim: #3d6647;
  --white: #ffffff;
  --radius: 16px;
  --radius-sm: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; }

/* LAYOUT */
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
#screen { flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:80px; scroll-behavior:smooth; }
#screen::-webkit-scrollbar { display:none; }

/* BOTTOM NAV */
#nav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; padding:8px 0 max(8px,env(safe-area-inset-bottom)); z-index:100; }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:none; background:none; color:var(--text-soft); font-size:9px; font-weight:500; letter-spacing:0.04em; text-transform:uppercase; padding:4px 0; cursor:pointer; transition:color 0.2s; }
.nav-btn .nav-icon { font-size:20px; line-height:1; }
.nav-btn.active { color:var(--green); }

/* PAGES */
.page { display:none; padding:0; }
.page.active { display:block; }

/* HEADER */
.page-header { padding:16px 16px 0; position:sticky; top:0; z-index:50; background:var(--bg); padding-top:max(16px, env(safe-area-inset-top)); }
.page-title { font-size:22px; font-weight:700; letter-spacing:-0.03em; margin-bottom:2px; }
.page-subtitle { font-size:12px; color:var(--text-soft); margin-bottom:12px; }

/* PILLS ROW */
.pills-row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; margin-bottom:8px; }
.pills-row::-webkit-scrollbar { display:none; }
.pill { flex-shrink:0; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text-soft); font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.pill.active { background:var(--green-glow); border-color:var(--green); color:var(--green); }
.pill.weekend { }
.pill.active.weekend { background:var(--amber-glow); border-color:var(--amber); color:var(--amber); }

/* CARDS */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin:0 16px 12px; overflow:hidden; }
.card-header { padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; }
.card-label { font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-soft); }
.card-title { font-size:17px; font-weight:700; letter-spacing:-0.02em; margin-top:2px; }
.card-body { padding:0 16px 14px; }

/* MEAL SLOT */
.meal-slot { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin:0 16px 10px; }
.meal-top { padding:14px 14px 0; }
.meal-type-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.meal-type { font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; }
.meal-type.col { color:#7ac8c8; }
.meal-type.pra { color:var(--green); }
.meal-type.cen { color:#a07af0; }
.meal-type.snu { color:var(--amber); }
.shuffle-btn { background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:5px 10px; color:var(--text-soft); font-size:11px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all 0.15s; }
.shuffle-btn:active { transform:scale(0.95); background:var(--green-glow); color:var(--green); }
.meal-name { font-size:16px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px; }
.meal-desc { font-size:12px; color:var(--text-soft); line-height:1.5; margin-bottom:12px; }
.meal-macros { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px 14px; background:rgba(0,0,0,0.2); border-top:1px solid var(--border); }
.macro-item { text-align:center; }
.macro-val { font-size:14px; font-weight:700; color:var(--text); }
.macro-lbl { font-size:9px; color:var(--text-soft); font-weight:500; letter-spacing:0.05em; margin-top:1px; }
.macro-item.kcal .macro-val { color:var(--green); }

/* DAILY TOTALS */
.daily-ring-section { margin:0 16px 12px; }
.daily-totals-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.totals-title { font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-soft); margin-bottom:14px; }
.totals-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.total-block { text-align:center; }
.total-val { font-size:20px; font-weight:800; letter-spacing:-0.03em; }
.total-val.k { color:var(--green); }
.total-val.p { color:#7ac8c8; }
.total-val.g { color:var(--amber); }
.total-val.c { color:#a07af0; }
.total-lbl { font-size:9px; color:var(--text-soft); font-weight:500; margin-top:2px; }
.total-bar { height:3px; border-radius:2px; margin-top:6px; background:var(--border); overflow:hidden; }
.total-bar-fill { height:100%; border-radius:2px; transition:width 0.4s ease; }
.total-bar-fill.k { background:var(--green); }
.total-bar-fill.p { background:#7ac8c8; }
.total-bar-fill.g { background:var(--amber); }
.total-bar-fill.c { background:#a07af0; }

/* WEEK VIEW */
.week-day-row { margin:0 16px 8px; }
.week-day-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.week-day-header { padding:12px 14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.week-day-name { font-size:13px; font-weight:700; }
.week-day-date { font-size:11px; color:var(--text-soft); }
.week-day-kcal { font-size:13px; font-weight:700; color:var(--green); }
.week-day-check { font-size:18px; }
.week-day-meals { padding:0 14px 12px; display:none; }
.week-day-meals.open { display:block; }
.week-meal-line { display:flex; justify-content:space-between; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--border); }
.week-meal-line:last-child { border-bottom:none; }
.week-meal-info { flex:1; }
.week-meal-type { font-size:9px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-soft); }
.week-meal-name { font-size:12px; font-weight:600; margin-top:1px; }
.week-meal-kcal { font-size:12px; font-weight:700; color:var(--text-soft); flex-shrink:0; margin-left:8px; }

/* PROGRESS 28GG */
.progress-section { margin:0 16px 12px; }
.progress-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.progress-label { font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-soft); }
.progress-count { font-size:20px; font-weight:800; color:var(--green); }
.days-grid-28 { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.day-dot { aspect-ratio:1; border-radius:6px; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--text-dim); font-weight:600; transition:all 0.15s; }
.day-dot.done { background:var(--green-glow); border-color:var(--green); color:var(--green); }
.day-dot.today { border-color:var(--green); box-shadow:0 0 0 2px var(--green-glow); }

/* FREQUENZE */
.freq-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin:0 16px 10px; padding:16px; }
.freq-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.freq-name { font-size:14px; font-weight:700; }
.freq-limit { font-size:11px; color:var(--text-soft); }
.freq-counter { display:flex; align-items:center; gap:10px; }
.freq-dots { display:flex; gap:5px; }
.freq-dot { width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; transition:all 0.15s; }
.freq-dot.filled { background:var(--green-glow); border-color:var(--green); }
.freq-dot.over { background:rgba(224,85,85,0.15); border-color:var(--red); }
.freq-btn { background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--text-soft); font-size:13px; cursor:pointer; }
.freq-reset { font-size:11px; color:var(--text-dim); cursor:pointer; text-decoration:underline; display:block; margin-top:8px; }

/* SPESA */
.spesa-cat { margin:0 16px 10px; }
.spesa-cat-title { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-soft); margin-bottom:6px; padding:0 2px; }
.spesa-cat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.spesa-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.15s; }
.spesa-item:last-child { border-bottom:none; }
.spesa-item:active { background:var(--card2); }
.spesa-check { width:20px; height:20px; border-radius:6px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.spesa-item.done .spesa-check { background:var(--green); border-color:var(--green); }
.spesa-item-text { flex:1; }
.spesa-item-name { font-size:13px; font-weight:500; }
.spesa-item.done .spesa-item-name { text-decoration:line-through; color:var(--text-dim); }
.spesa-item-qty { font-size:11px; color:var(--text-soft); margin-top:1px; }

/* TIMER */
.timer-section { margin:0 16px 12px; }
.timer-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 16px; text-align:center; }
.timer-label { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-soft); margin-bottom:12px; }
.timer-display { font-size:52px; font-weight:800; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; margin-bottom:16px; }
.timer-display.green { color:var(--green); }
.timer-display.amber { color:var(--amber); }
.timer-display.purple { color:#a07af0; }
.timer-buttons { display:flex; gap:10px; justify-content:center; }
.timer-btn { flex:1; max-width:120px; padding:12px; border-radius:var(--radius-sm); border:none; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.15s; }
.timer-btn.start { background:var(--green); color:#0e1912; }
.timer-btn.stop { background:var(--red); color:white; }
.timer-btn.reset { background:var(--card2); color:var(--text-soft); border:1px solid var(--border); }
.timer-btn:active { transform:scale(0.97); }
.timer-emoji { font-size:36px; margin-bottom:8px; }

/* TAGS / BADGES */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; letter-spacing:0.04em; }
.badge.weekend { background:var(--amber-glow); color:var(--amber); border:1px solid var(--amber-dim); }
.badge.free { background:rgba(224,85,85,0.12); color:var(--red); border:1px solid rgba(224,85,85,0.3); }
.badge.green { background:var(--green-glow); color:var(--green); border:1px solid var(--green-dim); }

/* TOAST */
#toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:#2d7444; color:white; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; opacity:0; transition:all 0.3s; z-index:999; white-space:nowrap; pointer-events:none; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* SECTION DIVIDER */
.section-divider { margin:4px 16px 10px; font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); padding-top:4px; }

/* ANIMATE */
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.meal-slot { animation:fadeIn 0.25s ease; }

/* SCROLLABLE CHIPS */
.section-note { margin:0 16px 10px; font-size:11px; color:var(--text-soft); line-height:1.6; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; }
</style>
</head>

let state = {
  selectedDay: new Date().getDay() === 0 ? 6 : new Date().getDay() - 1,
  // selectedDay clamped 0-6
  meals: {}, // key: "dayIdx_mealType" => ricettaIndex
  days28: [], // array di 28 booleans
  freqs: { pesce:0, carne:0, uova:0, formaggi:0, affettati:0 },
  spesa: {}, // itemName => checked bool
  expandedDays: {},
};

function loadState() {
  try {
    const saved = localStorage.getItem('dieta52_v2');
    if (saved) Object.assign(state, JSON.parse(saved));
  } catch(e) {}
  if (!state.days28 || state.days28.length !== 28) state.days28 = Array(28).fill(false);
}
function saveState() {
  try { localStorage.setItem('dieta52_v2', JSON.stringify(state)); } catch(e) {}
}

function getMealKey(dayIdx, mealType) { return `${dayIdx}_${mealType}`; }
function getRicetteForDay(dayIdx, mealType) {
  const isWE = GIORNI[dayIdx].weekend;
  if (mealType === 'colazione') return isWE ? RICETTE.colazione_weekend : RICETTE.colazione_feriale;
  if (mealType === 'pranzo') return isWE ? RICETTE.pranzo_weekend : RICETTE.pranzo_feriale;
  if (mealType === 'cena') return isWE ? RICETTE.cena_weekend : RICETTE.cena_feriale;
  if (mealType === 'snack') return RICETTE.snack_feriale;
  return [];
}
function getCurrentRicetta(dayIdx, mealType) {
  const k = getMealKey(dayIdx, mealType);
  const list = getRicetteForDay(dayIdx, mealType);
  const idx = state.meals[k] !== undefined ? state.meals[k] : 0;
  return list[idx % list.length];
}
function shuffleMeal(dayIdx, mealType) {
  const k = getMealKey(dayIdx, mealType);
  const list = getRicetteForDay(dayIdx, mealType);
  const cur = state.meals[k] !== undefined ? state.meals[k] : 0;
  state.meals[k] = (cur + 1) % list.length;
  saveState();
}

function getDailyTotals(dayIdx) {
  const isWE = GIORNI[dayIdx].weekend;
  const meals = isWE ? ['colazione','pranzo','cena'] : ['colazione','pranzo','cena','snack'];
  let tot = { kcal:0, p:0, g:0, c:0 };
  meals.forEach(m => {
    const r = getCurrentRicetta(dayIdx, m);
    if (r) { tot.kcal += r.kcal; tot.p += r.p; tot.g += r.g; tot.c += r.c; }
  });
  // Add EVO for meals (already included in recipes but let's show total)
  return tot;
}

const FREQ_DEF = [
  { key:'pesce', icon:'🐟', nome:'Pesce', max:4, note:'max 2×/sett lun–ven, illimitato weekend' },
  { key:'carne', icon:'🍗', nome:'Carne', max:4, note:'max 2×/sett lun–ven, illimitato weekend' },
  { key:'uova', icon:'🥚', nome:'Uova', max:2, note:'max 2×/settimana' },
  { key:'formaggi', icon:'🧀', nome:'Formaggi', max:1, note:'max 1×/settimana' },
  { key:'affettati', icon:'🥩', nome:'Affettati', max:2, note:'max 2×/settimana' },
];

function renderFrequenze() {
  let html = '<div class="section-note" style="margin-top:8px">Tappa ogni volta che consumi il gruppo alimentare. Reset ogni lunedì.</div>';
  FREQ_DEF.forEach(f => {
    const cur = state.freqs[f.key] || 0;
    const dots = Array.from({length:f.max},(_,i) => {
      const filled = i < cur;
      const over = cur > f.max && i < cur;
      return `<div class="freq-dot ${filled?(cur>f.max?'over':'filled'):''}" onclick="tapFreq('${f.key}',${i})">${filled?'✓':''}</div>`;
    }).join('');
    const overDots = cur > f.max ? Array.from({length:cur-f.max},(_,i) => 
      `<div class="freq-dot over">!</div>`
    ).join('') : '';

    html += `
    <div class="freq-card">
      <div class="freq-header">
        <div>
          <div class="freq-name">${f.icon} ${f.nome}</div>
          <div class="freq-limit">${f.note}</div>
        </div>
        <div style="font-size:22px;font-weight:800;color:${cur>f.max?'var(--red)':'var(--green)'}">${cur}</div>
      </div>
      <div class="freq-counter">
        <div class="freq-dots">${dots}${overDots}</div>
        <button class="freq-btn" onclick="incFreq('${f.key}')">+1</button>
      </div>
      <span class="freq-reset" onclick="resetFreq('${f.key}')">Azzera ${f.nome.toLowerCase()}</span>
    </div>`;
  });

  html += `
  <div style="margin:0 16px 10px">
    <button style="width:100%;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-soft);font-size:13px;font-weight:600;cursor:pointer" onclick="resetAllFreqs()">
      🔄 Reset tutti i contatori (nuovo lunedì)
    </button>
  </div>`;

  document.getElementById('frequenze-content').innerHTML = html;
}

function incFreq(key) {
  state.freqs[key] = (state.freqs[key] || 0) + 1;
  saveState();
  renderFrequenze();
  const f = FREQ_DEF.find(x=>x.key===key);
  if (state.freqs[key] > f.max) showToast(`⚠️ ${f.nome}: limite superato!`);
  else showToast(`${f.icon} +1 ${f.nome}`);
}
function tapFreq(key, idx) {
  state.freqs[key] = idx + 1;
  saveState();
  renderFrequenze();
}
function resetFreq(key) {
  state.freqs[key] = 0;
  saveState();
  renderFrequenze();
}
function resetAllFreqs() {
  FREQ_DEF.forEach(f => state.freqs[f.key] = 0);
  saveState();
  renderFrequenze();
  showToast('Frequenze azzerate ✅');
}

let timers = {};

  const timerDefs = [
    { id:'tisana', icon:'🍵', nome:'Tisana al finocchio', mins:10, color:'green', desc:'Dopo ogni cena' },

    const tm = timers[t.id] || { remaining: t.mins*60, running:false, done:false };

    const secs = (tm.remaining%60).toString().padStart(2,'0');
    html += `
    <div class="timer-section">

        <div class="timer-emoji">${t.icon}</div>
        <div class="timer-label">${t.nome} · ${t.desc}</div>

        <div class="timer-buttons">
          <button class="timer-btn ${tm.running?'stop':'start'}" onclick="toggleTimer('${t.id}',${t.mins})">
            ${tm.running?'⏸ Pausa':'▶ Avvia'}
          </button>
          <button class="timer-btn reset" onclick="resetTimer('${t.id}',${t.mins})">↺ Reset</button>
        </div>
      </div>
    </div>`;
  });

  html += `
  <div class="section-note">
    💡 Ricorda: bevi 1,5 lt di acqua al giorno · Elimina zucchero, dolcificanti, bevande gassate e alcol
  </div>`;

  document.getElementById('timer-content').innerHTML = html;
}

function toggleTimer(id, mins) {
  if (!timers[id]) timers[id] = { remaining: mins*60, running:false };
  const t = timers[id];
  if (t.running) {
    t.running = false;
    clearInterval(t.interval);
  } else {
    if (t.remaining <= 0) t.remaining = mins*60;
    t.running = true;
    t.interval = setInterval(() => {
      t.remaining--;
      if (t.remaining <= 0) {
        t.remaining = 0;
        t.running = false;
        clearInterval(t.interval);
        showToast('Timer completato! ✅');
      }
      updateTimerDisplay(id);
    }, 1000);
  }
  renderTimer();
}

function resetTimer(id, mins) {
  if (timers[id]) { clearInterval(timers[id].interval); }
  timers[id] = { remaining: mins*60, running:false };
  renderTimer();
}

function updateTimerDisplay(id) {
  const el = document.getElementById('td-'+id);
  if (!el || !timers[id]) return;
  const r = timers[id].remaining;
  const m = Math.floor(r/60).toString().padStart(2,'0');
  const s = (r%60).toString().padStart(2,'0');
  el.textContent = `${m}:${s}`;
}

// ============================================================
// NAVIGATION
// ============================================================
let currentPage = 'oggi';
const renderers = {
  oggi: renderOggi,
  settimana: renderSettimana,
  frequenze: renderFrequenze,
  spesa: renderSpesa,
  timer: renderTimer,
};

function goPage(name) {
  document.querySelector('.page.active')?.classList.remove('active');
  document.getElementById('page-'+name).classList.add('active');
  document.querySelector('.nav-btn.active')?.classList.remove('active');
  document.getElementById('nav-'+name).classList.add('active');
  currentPage = name;
  document.getElementById('screen').scrollTo(0,0);
  renderers[name]();
}

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============================================================
// INIT
// ============================================================
loadState();
// Set selected day to today
const todayReal = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
state.selectedDay = todayReal;
renderOggi();
</script>
